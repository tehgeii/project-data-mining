[server]
maxUploadSize = 20

[browser]
gatherUsageStats = false

# Tema gelap untuk semua halaman. Grafik Plotly ikut menyesuaikan
# karena memakai theme="streamlit" (bawaan st.plotly_chart).
[theme]
base = "dark"
primaryColor = "#F5A623"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1F2B"
textColor = "#E6EDF3"
linkColor = "#F5A623"
borderColor = "#30363D"
dataframeBorderColor = "#30363D"
showWidgetBorder = true
